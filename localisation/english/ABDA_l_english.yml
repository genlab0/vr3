l_english:
 ABDA_common_signals:0 "One Operational Picture"
 ABDA_common_signals_desc:0 "Dutch reconnaissance, British listening stations, Australian coastwatchers and American patrols must report to the same operations room. Common recognition codes will help our forces find each other before they find the enemy."
 ABDA_emergency_conference:0 "The Barrier Under Siege"
 ABDA_emergency_conference_desc:0 "The staff plans assumed time, reserves and secure sea lanes. The Japanese advance has called each assumption into question. The command must now decide what can be held, what must be evacuated, and where the next defensive line will stand."
 ABDA_consolidate_the_theatre:0 "Consolidate the Theatre"
 ABDA_consolidate_the_theatre_desc:0 "The immediate crisis has become a war of endurance. Reorganize the surviving formations, establish reserve depots and replace hurried improvisation with a sustainable campaign. Even a successful defense needs a secure base for the next advance."
 ABDA_american_logistical_backbone:0 "Supplied from Across the Pacific"
 ABDA_american_logistical_backbone_desc:0 "The coalition can rebuild only at the pace of American deliveries. Washington will coordinate shipping priorities and replacement schedules, making American logistical capacity the foundation of Allied strategy."
 ABDA_dutch_local_networks:0 "The Dutch Know the Way Back"
 ABDA_dutch_local_networks_desc:0 "Charts, harbor pilots, administrative records and contacts across the archipelago remain valuable after a withdrawal. Dutch officers will turn this knowledge into landing studies and plans for restoring the islands as Allied bases."
 ABDA_british_eastern_fleet:0 "The Eastern Fleet Holds the Flank"
 ABDA_british_eastern_fleet_desc:0 "Britain cannot promise every ship the Pacific command requests. It can protect the Indian Ocean approaches and threaten the western flank of the Japanese perimeter, freeing American strength for the central effort."
 ABDA_pacom:0 "From ABDACOM to PACOM"
 ABDA_pacom_desc:0 "The emergency coalition must become a lasting Pacific command. Its new charter places operational direction and strategic planning under American leadership. The Allies retain their forces and governments, but the campaign will now follow a common timetable set by Washington."
 ABDA_integrated_air_offensive:0 "Clear the Skies Ahead"
 ABDA_integrated_air_offensive_desc:0 "PACOM will concentrate Allied air effort on the next objective instead of dividing it equally between national sectors. Fighter sweeps, maritime strikes and airfield construction must prepare each advance."
 ABDA_amphibious_training:0 "Rehearse the Return"
 ABDA_amphibious_training_desc:0 "Australian combat experience, British combined operations and Dutch coastal knowledge will inform an American-led amphibious program. Every beach party must know how to unload supplies before the second wave arrives."
 ABDA_forward_repair_bases:0 "Move the Workshops Forward"
 ABDA_forward_repair_bases_desc:0 "A damaged ship should not have to cross half an ocean before returning to service. Mobile repair parties and standardized stores will follow the fleet into each newly secured anchorage."
 ABDA_seize_the_initiative:0 "The Timetable Is Ours"
 ABDA_seize_the_initiative_desc:0 "The defensive perimeter has served its purpose. American headquarters will now select the main axes of advance and allocate the shipping to support them. Our partners will shape the operations, but scattered national offensives must give way to a single campaign."
 ABDA_new_guinea_campaign:0 "Open the New Guinea Route"
 ABDA_new_guinea_campaign_desc:0 "Airfields along New Guinea offer a stepping stone back toward the archipelago. Secure the approaches, prepare the next landings and give Australian formations a leading role in the southern advance."
 ABDA_return_to_the_philippines:0 "The Road Back to the Philippines"
 ABDA_return_to_the_philippines_desc:0 "An American promise now becomes an Allied operation. Prepare the landings and air support needed to regain the Philippine bases and cut the sea lanes between Japan and its southern conquests."
 ABDA_return_to_the_indies:0 "Return to the East Indies"
 ABDA_return_to_the_indies_desc:0 "Dutch planners will help choose the ports and airfields that make the archipelago useful to the Allied advance. Liberation must bring functioning supply routes, not simply new flags over ruined harbors."
 ABDA_reopen_singapore:0 "Reopen the Singapore Route"
 ABDA_reopen_singapore_desc:0 "The western and eastern campaigns must meet at the Strait of Malacca. Prepare the forces and shipping to restore Singapore as the hinge between the Indian Ocean and the Pacific."
 ABDA_a_permanent_pacific_command:0 "An American-Led Pacific Order"
 ABDA_a_permanent_pacific_command_desc:0 "The command born to defend a barrier now spans the ocean. A permanent American-led headquarters will coordinate bases, exercises and contingency plans. Britain, Australia and the Netherlands remain partners, but American leadership has become the organizing principle of Pacific security."
 ABDA_naval_procurement:0 "American Escort Allocations"
 ABDA_naval_procurement_desc:0 "American yards will supply a common escort pool. National fleets keep their identities, while procurement and training increasingly follow American standards."

 ABDA_supreme_command:0 "ABDACOM / Pacific Command"
 ABDA_supreme_command_desc:0 "A coalition command whose operational capabilities grow as the Allies coordinate their forces. American logistical support gradually brings American strategic leadership."
 ABDA_maintain_strategic_flexibility_spirit:0 "Pacific Strategic Reserve"
 ABDA_maintain_strategic_flexibility_spirit_desc:0 "American naval forces retain the mobility to reinforce threatened sectors of the Pacific."
 ABDA_abdacom:0 "Establish ABDACOM"
 ABDA_abdacom_desc:0 "Australia, Britain, the Netherlands and the United States face a common threat in the Pacific. Establish a joint command to prepare the defense of the Malay Barrier and coordinate the forces each partner can spare."
 ABDA_fortress_singapore:0 "Fortress Singapore"
 ABDA_fortress_singapore_desc:0 "Singapore anchors Britain's position in the Far East. Its defenses must face the attack we may actually receive, whether it comes by land, sea or air."
 ABDA_abdacom_australia_focus:0 "Australia Takes Its Station"
 ABDA_abdacom_australia_focus_desc:0 "Australia will contribute troops, airfields and a secure southern base. Our officers must ensure that the coalition's plans also protect the approaches to our own shores."
 ABDA_abdacom_netherlands_focus:0 "The Dutch Contribution"
 ABDA_abdacom_netherlands_focus_desc:0 "The Netherlands brings naval forces, airfields and detailed knowledge of the East Indies. Its officers will make the archipelago's defense a coalition responsibility."
 ABDA_rubber_islands_defense:0 "Defend the Rubber Islands"
 ABDA_rubber_islands_defense_desc:0 "Reinforce the ports and air defenses of Java and Sumatra while they remain in Allied hands. Their resources and anchorages are vital to the southern barrier."
 ABDA_maintain_strategic_flexibility:0 "Maintain Strategic Flexibility"
 ABDA_maintain_strategic_flexibility_desc:0 "The United States must keep a mobile reserve available while the coalition prepares its forward defenses. The ability to reinforce a threatened sector may matter more than a rigid allocation of ships."
 ABDA_the_malay_barrier:0 "The Malay Barrier"
 ABDA_the_malay_barrier_desc:0 "Prepare the landward approaches and coastal anchorages around Singapore. The naval base cannot serve the fleet if an army can seize it from behind."
 ABDA_develop_naval_infrastructure:0 "Develop Naval Infrastructure"
 ABDA_develop_naval_infrastructure_desc:0 "Expand Allied repair and construction facilities. Australian and Dutch yards will help sustain the joint fleet wherever suitable national facilities remain available."
 ABDA_unified_naval_command:0 "A Unified Naval Command"
 ABDA_unified_naval_command_desc:0 "Our ships must fight as a fleet rather than as several squadrons awaiting separate instructions. Common procedures and joint exercises will make cooperation practical."
 ABDA_ship_a_day_sinking_quotas:0 "A Ship a Day"
 ABDA_ship_a_day_sinking_quotas_desc:0 "Submarines can continue the campaign even when the surface fleet must withdraw. Concentrate patrols against the shipping that sustains Japan's advance."
 ABDA_keep_trade_open:0 "Keep the Sea Lanes Open"
 ABDA_keep_trade_open_desc:0 "Coordinated screens and escort groups will protect the supply routes on which every Allied position depends."
 ABDA_faction_membership_requirement_tt:0 "Invite Australia, Britain, the Netherlands and the United States if they share our faction. Each country may accept or decline."
 ABDA_fortress_singapore_choice_tt:0 "Choose coastal, landward or mixed defenses for Singapore."
 ABDA_unified_naval_command_modifier_tt:0 "Joint Command: Navy experience gain from combat: §G+10%§!."
 ABDA_ship_a_day_modifier_tt:0 "Joint Command: Submarine attack and defense: §G+10%§!."
 ABDA_keep_trade_open_modifier_tt:0 "Joint Command: Screening efficiency and screen defense: §G+10%§!."
 ABDA_develop_naval_infrastructure_ast_tt:0 "Australia gains §G2 dockyards§! in a controlled core state with sufficient building slots."
 ABDA_develop_naval_infrastructure_HOL_tt:0 "The Netherlands gains §G2 dockyards§! in a controlled core state with sufficient building slots."
 ABDA_develop_naval_infrastructure_generic_tt:0 "Participating Australian and Dutch facilities receive dockyards where suitable states remain available."
 ABDA_events.1.t:0 "An Invitation to ABDACOM"
 ABDA_events.1.desc:0 "[FROM.GetNameDefCap] proposes a joint command to coordinate our defenses against Japan. Membership would bind our forces to common operational planning while leaving them under their own national governments."
 ABDA_events.1.a:0 "We must prepare together."
 ABDA_events.1.b:0 "Our forces will follow our own plans."
 ABDA_events.2.t:0 "A Partner Joins the Command"
 ABDA_events.2.desc:0 "[FROM.GetNameDefCap] has accepted the invitation to ABDACOM. Their officers will join our staff and begin coordinating plans for the Pacific."
 ABDA_events.2.a:0 "Welcome their delegation."
 ABDA_events.3.t:0 "An Invitation Declined"
 ABDA_events.3.desc:0 "[FROM.GetNameDefCap] has declined to join ABDACOM. Their government intends to retain separate operational arrangements."
 ABDA_events.3.a:0 "We must proceed with those willing to join."
 ABDA_events.4.t:0 "The Defenses of Singapore"
 ABDA_events.4.desc:0 "New defensive works are ready to begin around Singapore. Our staff must decide whether to prioritize the coast, the landward approaches, or a thinner defense of both."
 ABDA_events.4.a:0 "Strengthen the coastal batteries."
 ABDA_events.4.b:0 "Protect the landward approaches."
 ABDA_events.4.c:0 "Prepare for both threats."
 ABDA_events.5.t:0 "An Expanded Pacific Command"
 ABDA_events.5.desc:0 "[FROM.GetNameDefCap] invites us to join the Allied Pacific command. Its common procedures and accumulated experience would support our forces in the coming campaign."
 ABDA_events.5.a:0 "Join the command."
 ABDA_events.5.b:0 "Retain our independence of action."
 ABDA_command_category:0 "Allied Pacific Command"
 ABDA_command_category_desc:0 "A joint headquarters coordinates the Pacific campaign. Partners entering the war later may join the existing command and adopt its operational procedures."
 ABDA_join_the_command:0 "Join the Allied Pacific Command"
 ABDA_join_the_command_desc:0 "Enter the existing command alongside our faction partners and adopt the operational improvements they have already developed."